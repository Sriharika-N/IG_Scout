function go(s,back){
  if(!back && stack[stack.length-1]!==s) stack.push(s);
  var fn=screens[s];
  if(fn){S.innerHTML=fn();S.scrollTop=0;attachEvents(s);}
}
function openLink(url){if(url)window.open(url,'_blank','noopener,noreferrer')}
function toggleLike(id,el){
  var p=posts.find(function(x){return x.id===id});
  if(!p)return;
  p.liked=!p.liked;
  el.innerHTML=heartSVG(p.liked);
}
function toggleSave(id,el){
  var p=posts.find(function(x){return x.id===id});
  if(!p)return;
  p.saved=!p.saved;
  el.innerHTML=bookSVG(p.saved);
  showToast(p.saved?'Saved to '+capFirst(p.cat)+' collection':'Removed from saves');
}

// ── SEARCH ─────────────────────────────────────────────────────────────────
function doSearch(val){
  var area=document.getElementById('sarea');
  if(!area)return;
  if(!val.trim()){area.innerHTML=scoutHomeHTML();return}
  var v=val.toLowerCase();
  var matches=posts.filter(function(p){
    return p.tags.some(function(t){return t.includes(v)})||p.cap.toLowerCase().includes(v);
  });
  var html='<div style="padding:0 16px;margin-bottom:10px;font-size:11px;color:#888">Found <b style="color:#fff">'+matches.length+'</b> result'+(matches.length!==1?'s':'')+' for "<b style="color:#a855f7">'+val+'</b>"</div>';
  if(matches.length===0){
    html+='<div style="color:#666;font-size:12px;text-align:center;padding:30px">No results. Try "sapiens", "blazer", "pasta", or "paris".</div>';
  } else {
    html+='<div class="grid2">';
    matches.forEach(function(p){
      html+='<div class="tcard" onclick="scoutPost('+p.id+')">'
        +'<img src="'+p.img+'" referrerpolicy="no-referrer-when-downgrade"/>'
        +'<div style="padding:8px"><div style="font-size:11px;font-weight:600;line-height:1.3">'+p.cap+'</div>'
        +'<div style="font-size:9px;color:#a855f7;margin-top:3px">'+capFirst(p.cat)+'</div></div>'
        +'</div>';
    });
    html+='</div>';
  }
  area.innerHTML=html;
}

function handleFile(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(e){userImg2=e.target.result;activeFlow=flows.fashion;go('analyzing')};
  r.readAsDataURL(file);
}

// ── EVENT ATTACHMENT ──────────────────────────────────────────────────────────
function attachEvents(s){
  // Back button
  var b=document.getElementById('back');
  if(b){
    b.onclick=function(){
      if(stack.length>1){stack.pop();go(stack[stack.length-1],true)}
      else go('home',true);
    };
  }
  // Back buttons with class .bk that aren't #back
  document.querySelectorAll('.bk').forEach(function(el){
    if(el.id!=='back'){
      // already has inline onclick
    }
  });
  // Analyzing progress bar
  if(s==='analyzing'){
    var p=0;
    var bar=document.getElementById('pbar');
    var num=document.getElementById('pnum');
    var items=document.querySelectorAll('.step-item');
    var iv=setInterval(function(){
      p=Math.min(p+5,95);
      if(bar)bar.style.width=p+'%';
      if(num)num.textContent=p+'%';
      items.forEach(function(it,i){if(i<=Math.floor(p/25))it.style.opacity='1'});
    },50);
    setTimeout(function(){
      clearInterval(iv);
      if(bar)bar.style.width='100%';
      if(num)num.textContent='100%';
      setTimeout(function(){go('results')},250);
    },1800);
  }
}

go('home');
</script>
