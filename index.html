.bk{font-size:24px;cursor:pointer;background:none;border:none;color:#fff;padding:0 4px;line-height:1}

function go(s,back){
  if(s==='saved'&&!back)savedCat=null;
  if(s==='home'){userImg2=null;userContextPrompt="";var fks=Object.keys(flows);for(var i=0;i<fks.length;i++)delete flows[fks[i]]._lensLabel;}
  if(!back&&stack[stack.length-1]!==s)stack.push(s);
  var fn=screens[s];if(fn){S.innerHTML=fn();S.scrollTop=0;attachEvents(s);}
}
function goBack(){
  if(stack.length>1){stack.pop();var p=stack[stack.length-1];var fn=screens[p];if(fn){S.innerHTML=fn();S.scrollTop=0;attachEvents(p);}}
}
function openLink(url){if(url)window.open(url,'_blank','noopener,noreferrer')}
function toggleLike(id,el){var p=posts.find(function(x){return x.id===id});if(!p)return;p.liked=!p.liked;el.innerHTML=heartSVG(p.liked)}
function toggleSave(id,el){
  var p=posts.find(function(x){return x.id===id});if(!p)return;
  p.saved=!p.saved;el.innerHTML=bookSVG(p.saved);
  showToast(p.saved?'🔖 Saved to '+capFirst(p.cat)+' collection':'Removed from saves');
}
function scoutPost(id){
  var p=posts.find(function(x){return x.id===id});if(!p)return;
  userImg2=p.img;activeFlow=flows[p.flow]||flows.travel_paris;
  go('analyzing');
}
function demoScout(flowKey){
  userImg2=null;activeFlow=flows[flowKey]||flows.travel_paris;go('analyzing');
}

function doSearch(val){
  var area=document.getElementById('sarea');if(!area)return;
  if(!val.trim()){area.innerHTML=scoutHomeHTML();return}
  var v=val.toLowerCase();
  var matches=posts.filter(function(p){return p.tags.some(function(t){return t.indexOf(v)>-1})||p.cap.toLowerCase().indexOf(v)>-1});
  var h='<div style="padding:0 16px;margin-bottom:10px;font-size:11px;color:#888">Found <b style="color:#fff">'+matches.length+'</b> result'+(matches.length!==1?'s':'')+' for "<b style="color:#a855f7">'+val+'</b>"</div>';
  if(!matches.length){h+='<div style="color:#666;font-size:12px;text-align:center;padding:30px">No results. Try "sapiens", "blazer", "pasta", or "paris".</div>';}
  else{
    h+='<div class="grid2">';
    matches.forEach(function(p){
      h+='<div class="tcard" onclick="scoutPost('+p.id+')">'
        +'<img src="'+p.img+'" style="height:130px;object-fit:cover"/>'
        +'<div style="padding:8px"><div style="font-size:11px;font-weight:600;line-height:1.3">'+p.cap+'</div>'
        +'<div style="font-size:9px;color:#a855f7;margin-top:3px">'+capFirst(p.cat)+'</div></div>'
        +'</div>';
    });
    h+='</div>';
  }
  area.innerHTML=h;
}

var kwFlows={
  'eiffel tower':'travel_paris','paris':'travel_paris',
  'santorini':'travel_santorini','oia':'travel_santorini','greece':'travel_santorini',
  'bali':'travel_bali','ubud':'travel_bali',
  'pasta':'food_rome','cacio e pepe':'food_rome','rome':'food_rome',
  'white blazer':'fashion_blazer','linen blazer':'fashion_blazer','blazer':'fashion_blazer',
  'sapiens':'lit_sapiens','yuval harari':'lit_sapiens',
};

function detectFlow(text){
  var t=text.toLowerCase();
  var keys=Object.keys(kwFlows);
  for(var i=0;i<keys.length;i++){if(t.indexOf(keys[i])>-1)return kwFlows[keys[i]];}
  if(t.indexOf('travel')>-1||t.indexOf('landmark')>-1||t.indexOf('paris')>-1)return 'travel_paris';
  if(t.indexOf('food')>-1||t.indexOf('pasta')>-1)return 'food_rome';
  if(t.indexOf('fashion')>-1||t.indexOf('blazer')>-1)return 'fashion_blazer';
  if(t.indexOf('book')>-1)return 'lit_sapiens';
  return 'travel_paris';
}

function handleFile(file){
  if(!file)return;
  var promptElem = document.getElementById('uPrompt');
  userContextPrompt = promptElem ? promptElem.value.trim() : "";
  
  var r=new FileReader();
  r.onload=function(e){
    userImg2=e.target.result;
    var fk = detectFlow(userContextPrompt);
    activeFlow = flows[fk] || flows.travel_paris;
    go('analyzing');
  };
  r.readAsDataURL(file);
}

function attachEvents(s){
  if(s==='analyzing'){
    var p=0,bar=document.getElementById('pbar'),num=document.getElementById('pnum'),items=document.querySelectorAll('.step-item');
    var iv=setInterval(function(){
      p=Math.min(p+4,95);
      if(bar)bar.style.width=p+'%';
      if(num)num.textContent=p+'%';
      var done=Math.floor(p/25);
      items.forEach(function(it,i){
        var dot=it.querySelector('.sdot');var lbl=it.querySelector('.slbl');
        if(i<done){
          it.style.opacity='1';
          if(dot){dot.style.background='#22c55e';dot.innerHTML='<svg width="8" height="8" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
          if(lbl)lbl.style.color='#22c55e';
        } else if(i===done){
          it.style.opacity='1';
          if(dot){dot.style.background='#EC4899';dot.innerHTML='';}
          if(lbl)lbl.style.color='#fff';
        } else {
          it.style.opacity='0.25';
        }
      });
    },60);
    setTimeout(function(){
      clearInterval(iv);
      if(bar)bar.style.width='100%';if(num)num.textContent='100%';
      items.forEach(function(it){
        var dot=it.querySelector('.sdot');var lbl=it.querySelector('.slbl');
        it.style.opacity='1';
        if(dot){dot.style.background='#22c55e';dot.innerHTML='<svg width="8" height="8" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
        if(lbl)lbl.style.color='#22c55e';
      });
      setTimeout(function(){go('results')},400);
    },2200);
  }
}
