<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Scout — AI Visual Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;color:#fff;padding:10px}

/* Phone Mockup Frame */
#phone{width:390px;height:844px;background:#000;border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 20px 60px rgba(147,51,234,0.3);position:relative;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;position:relative}
#screen::-webkit-scrollbar{display:none}

/* Top & Bottom Navigation Bars */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 8px;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:100;border-bottom:1px solid #111}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:10px}

.btn{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;outline:none}
@keyframes scanline{0%{top:0%}100%{top:100%}}

/* Instagram Stories Bar */
.stories-container{display:flex;gap:14px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;width:100%;border-bottom:1px solid #111;flex-shrink:0}
.stories-container::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.story-avatar{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);display:flex;align-items:center;justify-content:center}
.story-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000}

/* Feed Scroll Container */
.feed-container{flex:1;overflow-y:auto;scrollbar-width:none}
.feed-container::-webkit-scrollbar{display:none}

/* Instagram Post Layout */
.ig-post{border-bottom:1px solid #181818;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ig-media{width:100%;height:340px;background:#141414;overflow:hidden}
.ig-media img{width:100%;height:100%;object-fit:cover}
.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:20px}
.ig-caption{padding:0 14px 12px;font-size:13px;line-height:1.4}

.tag{display:inline-block;padding:4px 8px;border-radius:8px;font-size:10px;background:#9333EA22;color:#ec4899;border:1px solid #9333EA44;margin:4px 4px 0 0}
.search-input{width:100%;background:#1c1c1e;border:1px solid #333;border-radius:10px;padding:10px 14px;color:#fff;font-size:13px;outline:none}
</style>
</head>
<body>

<div id="phone">
  <div id="screen"></div>
  <div class="bottom-nav">
    <button class="btn" onclick="go('home')"><span style="font-size:22px">🏠</span></button>
    <button class="btn" onclick="go('scout-landing')" style="position:relative">
      <span style="font-size:22px">🔍</span>
      <div style="position:absolute;top:-2px;right:-4px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#9333EA,#EC4899);border:2px solid #000"></div>
    </button>
    <button class="btn" onclick="go('saved')" title="Saved Collection"><span style="font-size:20px">🔖</span></button>
    <button class="btn" onclick="go('upload')"><span style="font-size:22px">➕</span></button>
    <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#9333EA,#EC4899);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">S</div>
  </div>
</div>

  { id: 6, username: 'katzs_delicatessen', location: 'Lower East Side, NYC', userImg: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=600&q=80', caption: 'Iconic Pastrami Sandwich at Katz\'s Deli 🥪', category: 'Food', saved: false, tags: ['katzs', 'deli', 'nyc', 'food'] },

  { id: 13, username: 'le_bernardin', location: 'Midtown, NYC', userImg: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&q=80', caption: 'Michelin Dining Experience at Le Bernardin 🍷', category: 'Food', saved: false, tags: ['michelin', 'fine dining', 'nyc'] },
  { id: 14, username: 'dc_literature', location: 'Library of Congress, DC', userImg: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&q=80', caption: 'Reading Room at Library of Congress 📚', category: 'Literature', saved: false, tags: ['library', 'dc', 'literature'] },

];

function sbar(){ return `<div class="sbar"><span>9:41</span><span style="font-size:10px">●●●● WiFi 80%</span></div>`; }
function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }

function go(s){
  const fn = screens[s];
  if(fn){
    screen.innerHTML = fn();
  }
}

// Inline Bookmark Toggle (Preserves Scroll Position)
function toggleSavePost(postId, btnEl) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.saved = !post.saved;
    btnEl.textContent = post.saved ? '🔖' : '🏷️';
  }
}

function triggerScoutOnImage(imageUrl) {
  userUploadedImage = imageUrl;
  go('analyzing');
  executeScoutAnalysis();
}

// In-Browser Image Compressor (Fixes Payload Size Bug)
function handleFileSelect(file) {
  if (!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const MAX_WIDTH = 800;
    const scaleSize = MAX_WIDTH / img.width;
    canvas.width = MAX_WIDTH;
    canvas.height = img.height * scaleSize;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    userUploadedImage = canvas.toDataURL('image/jpeg', 0.8);
    go('analyzing');
    executeScoutAnalysis();
  };
}

async function executeScoutAnalysis() {
  try {
    const res = await fetch('/api/scout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Data: userUploadedImage })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error);

    activeResult = data;
    go('results');

  } catch (err) {
    console.error('API Error:', err);
    alert('Analysis failed. Check your Gemini API key in Vercel settings.');
    go('home');
  }
}

const screens = {

    `).join('')}
  </div>`,

'scout-landing':()=>`${sbar()}

      <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>

saved:()=>{
  const savedList = initialPosts.filter(p => p.saved);
  const categories = ['Fashion', 'Food', 'Travel', 'Literature', 'Architecture'];

  if (currentSavedCategory) {
    const catItems = savedList.filter(p => p.category.toLowerCase() === currentSavedCategory.toLowerCase());

            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-size:20px">📁</span>
              <div style="text-align:left"><div style="font-size:13px;font-weight:600">${cat}</div><div style="font-size:10px;color:#666">${count} Saved Items</div></div>
            </div>
            <span>›</span>
          </button>
        `;
      }).join('')}
    </div>
  </div>`;
}
};

// Render search results without stealing focus
function renderSearchResults(val) {
  const container = document.getElementById('searchResultsArea');
  if (!container) return;
  if (!val.trim()) {
    container.innerHTML = `
      <div style="text-align:center;padding:20px 16px">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px">✦</div>
        <div style="font-size:20px;font-weight:800">Instagram ${grad('Scout')}</div>
      </div>`;
    return;
  }

  const matches = initialPosts.filter(p => p.tags.some(t => t.toLowerCase().includes(val.toLowerCase())) || p.caption.toLowerCase().includes(val.toLowerCase()));
  container.innerHTML = `
    <div style="font-size:11px;color:#888;margin-bottom:10px">Found ${matches.length} matches for "${val}":</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${matches.map(p => `
        <div class="btn" onclick="triggerScoutOnImage('${p.mediaImg}')" style="background:#141414;border:1px solid #222;border-radius:12px;overflow:hidden;text-align:left">
          <div style="height:110px;background:#222"><img src="${p.mediaImg}" style="width:100%;height:100%;object-fit:cover"/></div>
          <div style="padding:8px"><div style="font-size:11px;font-weight:600">${p.caption}</div></div>
        </div>
      `).join('')}
    </div>`;
}

go('home');
</script>
</body>
</html>
