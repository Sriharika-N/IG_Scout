<html lang="en">
<head>
<meta charset="UTF-8">

<title>Instagram Scout — AI Visual Search Prototype</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22[http://www.w3.org/2000/svg%22](http://www.w3.org/2000/svg%22) viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px}

/* Centered Phone Frame */
#phone{width:390px;height:844px;background:#000;border-radius:44px;overflow:hidden;box-shadow:0 0 0 12px #1a1a1a,0 0 0 14px #333,0 40px 100px rgba(147,51,234,0.3);position:relative;flex-shrink:0;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}

.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:50}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:12px}
.btn{cursor:pointer;background:none;border:none;color:inherit;padding:0;font-family:inherit;font-size:inherit}

@keyframes scanline{0%{top:0%}100%{top:100%}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastSlide{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

.fadeup{animation:fadeup 0.35s ease forwards}

/* Instagram Feed Posts */
.ig-post{border-bottom:1px solid #181818;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.ig-media{width:100%;height:320px;background:#1a1a1a;overflow:hidden}
.ig-media img{width:100%;height:100%;object-fit:cover;display:block}
.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;font-size:20px}
.ig-caption{padding:0 16px 12px;font-size:13px;line-height:1.4}

.search-input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:10px 14px;color:#fff;font-size:13px;outline:none}

/* Grid Cards for Collections */
.grid-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.thumb-card{background:#111;border:1px solid #222;border-radius:16px;overflow:hidden;text-align:left;cursor:pointer;position:relative}
.thumb-card img{width:100%;height:120px;object-fit:cover;display:block;background:#222}

/* Toast Notification Pill */
#toastPill{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);color:#000;padding:10px 18px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:none;z-index:200;animation:toastSlide 0.3s ease}
</style>
</head>
<body>

<div id="phone">

function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }
function sponsored(icon, brand, copy, cta){ return `<div style="margin:12px 16px 16px;padding:12px;border-radius:16px;background:#111;border:1px solid #222;display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;border-radius:10px;background:#1a2a3a;display:flex;align-items:center;justify-content:center;font-size:18px">${icon}</div><div style="flex:1"><div style="color:#555;font-size:10px">Sponsored · ${brand}</div><div style="color:#eee;font-size:11px;font-weight:600">${copy}</div></div><button class="btn" style="color:#60a5fa;font-size:11px;font-weight:600">${cta}</button></div>`; }

function go(s, cat){
  if(cat) currentCat = cat;
  const fn = screens[s];
  if(fn){
    screen.innerHTML = fn();
    screen.scrollTop = 0;
    attachEvents(s);
  }
}

function openExternalLink(url) {
  if (url) {
    window.open(url, '_blank');
  }
}

// Preserve Scroll Position & In-App Notification
function toggleSavePost(postId, btnEl) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.saved = !post.saved;
    btnEl.textContent = post.saved ? '🔖' : '🏷️';
    showToast(post.saved ? `✨ Saved to ${post.category} Collection` : 'Removed from Saved Items');
  }
}

function triggerScoutOnItem(postId) {
  const post = initialPosts.find(p => p.id === postId);
  if (!post) return;
  userUploadedImage = post.mediaImg;
  currentCat = post.category.toLowerCase();
  go('analyzing');
  executeScoutAnalysis(post.mediaImg);
}

function handleFileSelect(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    userUploadedImage = e.target.result;
    go('analyzing');
    executeScoutAnalysis(null);
  };
  reader.readAsDataURL(file);
}

async function executeScoutAnalysis(imgUrl) {
  try {
    const res = await fetch('/api/scout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Data: userUploadedImage, imageUrl: imgUrl })
    });

    const data = await res.json();
    activeResult = data;
    go('results');
  } catch (err) {
    console.warn('Backend fallback:', err);
    go('results');
  }
}

    <input type="file" id="imgInp" accept="image/*" style="display:none" onchange="handleFileSelect(this.files[0])">
    <div onclick="document.getElementById('imgInp').click()" style="cursor:pointer;border:2px dashed #9333EA66;border-radius:24px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;background:#9333EA08">
      <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#9333EA,#EC4899);display:flex;align-items:center;justify-content:center;font-size:28px">📤</div>
      <div style="text-align:center"><div style="font-weight:600;color:#fff;font-size:14px;margin-bottom:4px">Upload Any Image</div><div style="color:#555;font-size:12px">Food · Fashion · Travel · Products</div></div>
      <div style="padding:10px 24px;border-radius:20px;background:linear-gradient(135deg,#9333EA,#EC4899);font-size:13px;font-weight:600;color:#fff">Choose Photo</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;padding:0 20px;margin:4px 0 16px"><div style="flex:1;height:1px;background:#222"></div><span style="color:#444;font-size:12px">or try a demo</span><div style="flex:1;height:1px;background:#222"></div></div>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
    <div style="color:#444;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Demo Images — Scout in Action</div>
    ${[{e:'🍝',t:'Italian Food',cat:'food'},{e:'👗',t:'Fashion Outfit',cat:'fashion'},{e:'🏛️',t:'Travel Destination',cat:'travel'}].map(d=>`<button class="btn demo-btn" data-cat="${d.cat}" style="display:flex;align-items:center;gap:14px;background:#111;border-radius:16px;padding:14px;border:1px solid #222;width:100%"><div style="width:52px;height:52px;border-radius:12px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${d.e}</div><div style="text-align:left;flex:1"><div style="font-weight:600;color:#fff;font-size:13px">${d.t}</div><div style="color:#555;font-size:11px;margin-top:2px">Tap to see Scout analyse this</div></div><div style="display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;background:#EC489922"><span style="font-size:10px;color:#EC4899">✦ Scout</span></div></button>`).join('')}
  </div>`,

analyzing:()=>`${sbar()}
  <div style="height:780px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px">
    <div style="position:relative;margin-bottom:32px">
      <div style="width:180px;height:180px;border-radius:24px;border:2px solid #9333EA44;background:#111;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden;position:relative">
        ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : (mockData[currentCat]?.emoji || '👗')}
        <div style="position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#9333EA,#EC4899,transparent);animation:scanline 2s linear infinite;top:0"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
      <span style="font-size:18px;font-weight:700;color:#fff">Instagram</span>${grad('<span style="font-size:18px;font-weight:700">Scout</span>')}<span style="color:#666;font-size:14px">is analysing</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;width:240px;margin-bottom:24px" id="steps">
      ${['Scanning visual elements...','Identifying context and intent...','Matching to Scout database...','Building your results...'].map((s,i)=>`<div class="step-item" data-idx="${i}" style="display:flex;align-items:center;gap:10px;opacity:${i===0?1:0.25};transition:opacity 0.4s"><div class="step-dot" style="width:16px;height:16px;border-radius:50%;background:${i===0?'linear-gradient(135deg,#9333EA,#EC4899)':'#222'};display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0"></div><span style="font-size:12px;color:${i===0?'#ccc':'#444'}">${s}</span></div>`).join('')}
    </div>
    <div style="width:240px;height:4px;background:#1a1a1a;border-radius:4px;overflow:hidden"><div id="progbar" style="height:100%;width:0%;background:linear-gradient(90deg,#9333EA,#EC4899,#F59E0B);border-radius:4px;transition:width 0.1s"></div></div>
    <div id="prognum" style="color:#444;font-size:11px;margin-top:6px">0%</div>
  </div>`,

results:()=>{
  const d = mockData[currentCat] || mockData.fashion;
  const ai = activeResult?.aiAnalysis;
  const displayLabel = ai?.summary || d.label;
  const buyUrl = ai?.externalBuyUrl || '[https://www.google.com/search?tbm=shop&q=minimalist+white+linen+set](https://www.google.com/search?tbm=shop&q=minimalist+white+linen+set)';

  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn" id="back" style="font-size:22px;color:#fff">‹</button>
      <span style="font-size:13px;color:#9333EA">✦</span>
      <span style="font-weight:600;font-size:15px">Scout Results</span>
    </div>
    <div style="background:#9333EA22;color:#9333EA;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:600">AI Powered</div>
  </div>

  <div style="padding:12px 16px">
    <div style="border-radius:20px;overflow:hidden;border:1px solid #9333EA33;position:relative">
      <div style="height:200px;background:${d.bg};display:flex;align-items:center;justify-content:center;overflow:hidden">
        ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : `<div style="font-size:90px">${d.emoji}</div>`}
      </div>
      <div style="position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.95))">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#9333EA,#EC4899);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px">✦</div>
          <p style="color:#fff;font-size:12px;line-height:1.4;margin:0">${displayLabel}</p>
        </div>
      </div>
    </div>
  </div>

  <div style="margin:0 16px 14px;padding:10px 14px;border-radius:14px;background:#111;border:1px solid #222;display:flex;align-items:center;gap:12px">
    <div style="flex:1">
      <div style="color:#444;font-size:10px;margin-bottom:4px">Scout Confidence</div>
      <div style="height:4px;background:#222;border-radius:4px;overflow:hidden">
        <div style="width:94%;height:100%;background:linear-gradient(90deg,#9333EA,#EC4899);border-radius:4px"></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:700;color:#9333EA">94%</div>
    <div style="font-size:10px;color:#444;text-transform:capitalize">${currentCat}</div>
  </div>

  <div style="padding:0 16px 14px">
    <div style="color:#444;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Take Action</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn fadeup" onclick="openExternalLink('${buyUrl}')" style="display:flex;align-items:center;gap:12px;background:#111;border-radius:14px;padding:12px;border:1px solid #EC489933;width:100%">
        <div style="width:42px;height:42px;border-radius:10px;background:#EC489922;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🛍️</div>
        <div style="text-align:left;flex:1">
          <div style="font-weight:600;color:#fff;font-size:13px">Shop / Explore Online</div>
          <div style="font-size:11px;margin-top:1px;color:#EC4899">View matching store results</div>
        </div>
        <span style="color:#333;font-size:18px">›</span>
      </button>
    </div>
  </div>

  <div style="padding:0 16px 8px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <span style="color:#F59E0B;font-size:12px">🔖</span>
      <span style="color:#444;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px">From Your Saves</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${d.saves.map(s=>`
        <div style="background:#111;border-radius:12px;padding:10px;border:1px solid #1a1a1a">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
            <div style="width:14px;height:14px;border-radius:3px;background:${s.t==='reel'?'#EC489922':'#9333EA22'};display:flex;align-items:center;justify-content:center;font-size:7px;color:${s.t==='reel'?'#EC4899':'#9333EA'}">${s.t==='reel'?'▶':'◼'}</div>
            <span style="font-size:9px;color:#555;text-transform:capitalize">${s.t}</span>
          </div>
          <div style="font-size:10px;color:#ccc;line-height:1.3;margin-bottom:4px">${s.l}</div>
          <div style="font-size:9px;color:#444">${s.u}</div>
        </div>
      `).join('')}
    </div>
  </div>
  ${sponsored(currentCat==='food'?'🍽️':currentCat==='fashion'?'👜':'✈️',currentCat==='food'?'Swiggy Dineout':currentCat==='fashion'?'Myntra':'MakeMyTrip',currentCat==='food'?'Book a table & get 25% off':currentCat==='fashion'?'Shop the look':'Plan your trip','View')}`;
},

saved:()=>{
  const savedList = initialPosts.filter(p => p.saved);
  const categories = ['Fashion', 'Food', 'Travel', 'Literature', 'Architecture'];

  if (currentSavedCategory) {
    const catItems = savedList.filter(p => p.category.toLowerCase() === currentSavedCategory.toLowerCase());
    return `${sbar()}
      <div style="display:flex;align-items:center;gap:10px;padding:8px 16px 4px">
        <button class="btn" onclick="currentSavedCategory=null;go('saved')" style="font-size:22px;color:#fff">‹</button>
        <span style="font-weight:600;font-size:15px">${currentSavedCategory} Collection</span>
      </div>
      <div style="padding:12px 16px">
        ${catItems.length === 0 ? `<div style="color:#666;font-size:12px;text-align:center;margin-top:40px">No items saved in ${currentSavedCategory} yet.<br>Go to Home Feed and tap 🏷️ on any post!</div>` : `
          <div class="grid-container">
            ${catItems.map(item => `
              <div class="thumb-card" onclick="triggerScoutOnItem(${item.id})">
                <img src="${item.mediaImg}"/>
                <div style="padding:8px"><div style="font-size:11px;font-weight:600">${item.caption}</div></div>
              </div>
            `).join('')}
          </div>
        `}
      </div>`;
  }

  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn" id="back" style="font-size:22px;color:#fff">‹</button>
      <span style="font-weight:600;font-size:15px">Saved Collections</span>
    </div>
  </div>
  <div style="padding:12px 16px">
    <div class="grid-container">
      ${categories.map(cat => {
        const count = savedList.filter(p => p.category.toLowerCase() === cat.toLowerCase()).length;
        const coverImg = categoryCovers[cat];
        return `
          <div class="thumb-card" onclick="currentSavedCategory='${cat}';go('saved')">
            <img src="${coverImg}"/>
            <div style="padding:8px">
              <div style="font-size:12px;font-weight:700;color:#fff">${cat}</div>
              <div style="font-size:9px;color:#9333EA;margin-top:2px;font-weight:600">${count} Bookmarks</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  </div>`;
}
};

function renderSearchResults(val) {
  const container = document.getElementById('searchResultsArea');
  if (!container) return;
  if (!val.trim()) {
    container.innerHTML = `
      <div style="text-align:center;padding:32px 24px 24px">
        <div style="width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;position:relative">✦<div style="position:absolute;top:-6px;right:-6px;background:#000;border-radius:20px;padding:1px 5px;font-size:9px;font-weight:700;color:#9333EA;border:1px solid #9333EA44">AI</div></div>
        <div style="font-size:28px;font-weight:800;color:#fff;margin-bottom:4px">Instagram ${grad('Scout')}</div>
        <div style="color:#666;font-size:13px">Show me anything. I'll find it for you.</div>
      </div>`;
    return;
  }

  const matches = initialPosts.filter(p => p.tags.some(t => t.toLowerCase().includes(val.toLowerCase())) || p.caption.toLowerCase().includes(val.toLowerCase()));
  container.innerHTML = `
    <div style="font-size:11px;color:#888;margin-bottom:10px">Found ${matches.length} matches for "${val}":</div>
    <div class="grid-container">
      ${matches.map(p => `
        <div class="thumb-card" onclick="triggerScoutOnItem(${p.id})">
          <img src="${p.mediaImg}"/>
          <div style="padding:8px"><div style="font-size:11px;font-weight:600">${p.caption}</div></div>
        </div>
      `).join('')}
    </div>`;
}

function attachEvents(s){
  const b=document.getElementById('back');
  if(b){
    const bm={'scout-landing':'home',upload:'scout-landing',results:'upload',saved:'home'};
    b.onclick=()=>go(bm[s]||'home');
  }
  if(s==='home'){
    const sb=document.getElementById('scoutBtn');
    if(sb) sb.onclick=()=>go('scout-landing');
  }
  if(s==='scout-landing'){
    document.querySelectorAll('.action-btn').forEach(btn=>{
      btn.onclick=()=>go('upload',btn.dataset.cat);
    });
  }
  if(s==='upload'){
    document.querySelectorAll('.demo-btn').forEach(btn=>{
      btn.onclick=()=>{ userUploadedImage=null; currentCat=btn.dataset.cat; go('analyzing'); };
    });
  }
  if(s==='analyzing'){
    let p=0;
    const bar=document.getElementById('progbar'),num=document.getElementById('prognum'),items=document.querySelectorAll('.step-item');
    const iv=setInterval(()=>{
      p=Math.min(p+4,95);
      if(bar)bar.style.width=p+'%';
      if(num)num.textContent=p+'%';
      const si=Math.floor(p/25);
      items.forEach((it,i)=>{if(i<=si)it.style.opacity='1';});
    },60);
    setTimeout(()=>{
      clearInterval(iv);
      if(bar)bar.style.width='100%';
      if(num)num.textContent='100%';
      setTimeout(()=>go('results'),300);
    },2200);
  }
}

go('home');
</script>
</body>
</html>
