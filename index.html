<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px;color:#fff}

/* Phone Frame */
#phone{width:390px;height:844px;background:#000;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 0 0 12px #2c2c2e,0 30px 90px rgba(147,51,234,0.35);position:relative;flex-shrink:0;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;background:#000}
#screen::-webkit-scrollbar{display:none}

.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:50}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:10px}
.btn{cursor:pointer;background:none;border:none;color:inherit;padding:0;font-family:inherit;font-size:inherit;display:inline-flex;align-items:center;justify-content:center}

@keyframes scanline{0%{top:0%}100%{top:100%}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastSlide{from{transform:translate(-50%,100%);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.fadeup{animation:fadeup 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards}

/* Instagram Posts */
.ig-post{border-bottom:1px solid #1a1a1a;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ig-media{width:100%;height:380px;background:#141414;overflow:hidden;position:relative}
.ig-media img{width:100%;height:100%;object-fit:cover;display:block}
.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:22px}
.ig-caption{padding:0 14px 12px;font-size:13px;line-height:1.4}

.search-input{width:100%;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:10px 14px;color:#fff;font-size:13px;outline:none}
.search-input::placeholder{color:#777}

/* Grid Cards for Collections */
.grid-container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.thumb-card{background:#121212;border:1px solid #222;border-radius:14px;overflow:hidden;text-align:left;cursor:pointer;position:relative;transition:transform 0.15s ease}
.thumb-card:active{transform:scale(0.97)}
.thumb-card img{width:100%;height:130px;object-fit:cover;display:block;background:#1a1a1a}

/* Toast Pill */
#toastPill{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;border:1px solid #9333EAaa;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.8);display:none;z-index:200;white-space:nowrap;animation:toastSlide 0.25s ease}
</style>

function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }
function sponsored(icon, brand, copy, cta, linkUrl){ return `<div style="margin:12px 14px 16px;padding:12px;border-radius:16px;background:#111;border:1px solid #222;display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;border-radius:10px;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-size:18px">${icon}</div><div style="flex:1"><div style="color:#666;font-size:10px;font-weight:600">Sponsored · ${brand}</div><div style="color:#eee;font-size:11px;font-weight:600">${copy}</div></div><button class="btn" onclick="openExternalLink('${linkUrl}')" style="color:#60a5fa;font-size:11px;font-weight:600">${cta}</button></div>`; }

    screen.innerHTML = fn();
    screen.scrollTop = 0;
    attachEvents(s);
  }
}

function openExternalLink(url) {
  if (url) {
    window.open(url, '_blank', 'noopener,noreferrer');
  }
}

function toggleLikePost(postId, btnEl) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.liked = !post.liked;
    btnEl.textContent = post.liked ? '❤️' : '♥';
    btnEl.style.color = post.liked ? '#ef4444' : '#fff';
  }
}

function toggleSavePost(postId, btnEl) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.saved = !post.saved;
    btnEl.textContent = post.saved ? '🔖' : '🏷️';
    showToast(post.saved ? `✨ Saved to ${post.category} Collection` : 'Removed from Saved Items');
  }
}

function triggerScoutOnItem(postId) {
  const post = initialPosts.find(p => p.id === postId);
  if (!post) return;
  userUploadedImage = post.mediaImg;
  currentCat = post.category.toLowerCase();
  go('analyzing');
  executeScoutAnalysis(post.mediaImg);
}

function handleFileSelect(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    userUploadedImage = e.target.result;
    go('analyzing');
    executeScoutAnalysis(null);
  };
  reader.readAsDataURL(file);
}

async function executeScoutAnalysis(imgUrl) {
  try {
    const res = await fetch('/api/scout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Data: userUploadedImage?.startsWith('data:') ? userUploadedImage : null, imageUrl: imgUrl || userUploadedImage })
    });

    const data = await res.json();
    if (data?.aiAnalysis) {
      activeResult = data;
      if (data.aiAnalysis.category) {
        currentCat = data.aiAnalysis.category.toLowerCase();
      }
    }
    go('results');
  } catch (err) {
    console.warn('Backend endpoint fallback activated:', err);
    activeResult = null;
    go('results');
  }
}

function renderSearchResults(val) {
  const container = document.getElementById('searchResultsArea');
  if (!container) return;
  if (!val.trim()) {
    go('scout-landing');
    return;
  }

  const matches = initialPosts.filter(p => p.tags.some(t => t.toLowerCase().includes(val.toLowerCase())) || p.caption.toLowerCase().includes(val.toLowerCase()));
  container.innerHTML = `
    <div style="padding:0 16px;margin-bottom:10px;font-size:11px;color:#888">Found ${matches.length} matches for "${val}":</div>
    <div class="grid-container">
      ${matches.length === 0 ? `<div style="grid-column:1/span 2;color:#666;font-size:12px;text-align:center;padding:20px">No matching posts found. Try "blazer", "sushi", or "paris".</div>` : matches.map(p => `
        <div class="thumb-card" onclick="triggerScoutOnItem(${p.id})">
          <img src="${p.mediaImg}"/>
          <div style="padding:8px"><div style="font-size:11px;font-weight:600">${p.caption}</div></div>
        </div>
      `).join('')}
    </div>`;
}

function attachEvents(s){
  const b=document.getElementById('back');
  if(b){
    const bm={'scout-landing':'home',upload:'scout-landing',results:'upload',saved:'home'};
    b.onclick=()=>go(bm[s]||'home');
  }
  if(s==='home'){
    const sb=document.getElementById('scoutBtn');
    if(sb) sb.onclick=()=>go('scout-landing');
  }
  if(s==='upload'){
    document.querySelectorAll('.demo-btn').forEach(btn=>{
      btn.onclick=()=>{ userUploadedImage=null; currentCat=btn.dataset.cat; go('analyzing'); executeScoutAnalysis(null); };
    });
  }
  if(s==='analyzing'){
    let p=0;
    const bar=document.getElementById('progbar'),num=document.getElementById('prognum'),items=document.querySelectorAll('.step-item');
    const iv=setInterval(()=>{
      p=Math.min(p+5,95);
      if(bar)bar.style.width=p+'%';
      if(num)num.textContent=p+'%';
      const si=Math.floor(p/25);
      items.forEach((it,i)=>{if(i<=si)it.style.opacity='1';});
    },50);
    setTimeout(()=>{
      clearInterval(iv);
      if(bar)bar.style.width='100%';
      if(num)num.textContent='100%';
      setTimeout(()=>go('results'),250);
    },1800);
  }
}
