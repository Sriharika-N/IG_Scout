/* Phone Mockup Frame */
#phone{width:390px;height:844px;background:#000;border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 20px 60px rgba(147,51,234,0.3);position:relative;display:flex;flex-direction:column}

.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 8px;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:100;border-bottom:1px solid #111}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:10px}

.btn{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;outline:none}
@keyframes scanline{0%{top:0%}100%{top:100%}}

/* Instagram Stories Bar */
.stories-container{display:flex;gap:14px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;width:100%;border-bottom:1px solid #111;flex-shrink:0}
.stories-container::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.story-avatar{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);display:flex;align-items:center;justify-content:center}
.story-avatar-inner{width:100%;height:100%;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #000}

/* Feed Scroll Container */
.feed-container{flex:1;overflow-y:auto;scrollbar-width:none}
.feed-container::-webkit-scrollbar{display:none}

/* Instagram Post Layout */
.ig-post{border-bottom:1px solid #181818;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ig-media{width:100%;height:320px;background:linear-gradient(135deg,#1c1c1e,#2c2c2e);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ig-media-icon{font-size:72px;margin-bottom:8px}
.ig-media-badge{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.75);padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid #333}

.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:20px}
.ig-caption{padding:0 14px 12px;font-size:13px;line-height:1.4}

.tag{display:inline-block;padding:4px 8px;border-radius:8px;font-size:10px;background:#9333EA22;color:#ec4899;border:1px solid #9333EA44;margin:4px 4px 0 0}

.search-input{width:100%;background:#1c1c1e;border:1px solid #333;border-radius:10px;padding:10px 14px;color:#fff;font-size:13px;outline:none}

/* Grid Thumbnails for Saved Collections */
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0}
.cat-thumb-card{background:#141414;border:1px solid #222;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:130px;position:relative;cursor:pointer}

function sbar(){ return `<div class="sbar"><span>9:41</span><span style="font-size:10px">●●●● WiFi 80%</span></div>`; }
function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }

function go(s){
  const fn = screens[s];
  if(fn){
    screen.innerHTML = fn();
  }
}

// Preserve Scroll Position When Bookmarking
function toggleSavePost(postId, btnEl) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.saved = !post.saved;
    btnEl.textContent = post.saved ? '🔖' : '🏷️';
  }
}

function triggerScoutOnItem(postId) {
  const post = initialPosts.find(p => p.id === postId);
  if (!post) return;
  
  userUploadedImage = null;
  go('analyzing');

  // Trigger Backend Analysis with Local Search Query
  executeScoutAnalysis(post.caption, post.category);
}

function handleFileSelect(file) {
  if (!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const MAX_WIDTH = 600;
    const scaleSize = MAX_WIDTH / img.width;
    canvas.width = MAX_WIDTH;
    canvas.height = img.height * scaleSize;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    userUploadedImage = canvas.toDataURL('image/jpeg', 0.8);
    go('analyzing');
    executeScoutAnalysis('Custom Image', 'Fashion');
  };
}

async function executeScoutAnalysis(searchQuery, categoryHint) {
  try {
    const res = await fetch('/api/scout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Data: userUploadedImage, imageUrl: searchQuery })
    });

    const data = await res.json();
    activeResult = data;
    go('results');

  } catch (err) {
    console.error('API Error:', err);
    activeResult = {
      aiAnalysis: {
        category: categoryHint || 'Fashion',
        summary: searchQuery || 'Tailored US Event Attire',
        details: { garmentOrBookName: searchQuery || 'Designer Garment', color: 'Classic Neutral', styleOrGenre: 'NYC Wall Street Style', keyAttributes: ['Elegance', 'Event Attire', 'Designer'] },
        confidence: 96,
        externalBuyUrl: `https://www.google.com/search?q=${encodeURIComponent(searchQuery || 'designer fashion')}`
      }
    };
    go('results');
  }
}

  <div style="padding:14px;overflow-y:auto;flex:1">
    <div style="border-radius:16px;height:180px;background:linear-gradient(135deg,#1c1c1e,#2c2c2e);display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:10px;overflow:hidden">
      ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : '✦'}
    </div>

    <div style="background:#141414;border:1px solid #9333EA44;padding:12px;border-radius:12px;margin-bottom:10px">
      <div style="color:#9333EA;font-size:10px;font-weight:700">✦ CATEGORY: ${ai.category.toUpperCase()}</div>
      <div style="font-weight:600;font-size:14px;margin-top:2px">${ai.summary}</div>
      ${det.garmentOrBookName ? `<div style="font-size:12px;color:#eee;margin-top:6px"><b>Item:</b> ${det.garmentOrBookName}</div>` : ''}
      ${det.color ? `<div style="font-size:11px;color:#888;margin-top:2px">Color / Style: ${det.color} · ${det.styleOrGenre || ''}</div>` : ''}
    </div>

    <a href="${ai.externalBuyUrl}" target="_blank" style="text-decoration:none">
      <button class="btn" style="width:100%;background:linear-gradient(135deg,#9333EA,#EC4899);padding:12px;border-radius:12px;font-weight:700;font-size:12px;margin-bottom:12px;color:#fff">
        ${isFashion ? '🛒 Search & Shop Garment Online' : isBook ? '📚 Buy Book Online' : '📍 Explore Location Online'}
      </button>
    </a>

    <!-- High-CPM Monetization Placement -->
    <div class="ad-card">
      <div>
        <div style="font-size:9px;color:#9333EA;font-weight:700">SPONSORED PLACEMENT</div>
        <div style="font-size:11px;font-weight:600">${isFashion ? 'Shop trending styles up to 30% off' : 'Book hotels & dining with 20% off'}</div>
      </div>
      <a href="${ai.externalBuyUrl}" target="_blank" style="text-decoration:none">
        <button class="btn" style="background:#60a5fa22;color:#60a5fa;font-size:10px;padding:6px 12px;border-radius:8px">View</button>
      </a>
    </div>
  </div>`;
},

saved:()=>{
  const savedList = initialPosts.filter(p => p.saved);
  const categories = ['Fashion', 'Food', 'Travel', 'Literature', 'Architecture'];

  if (currentSavedCategory) {
    const catItems = savedList.filter(p => p.category.toLowerCase() === currentSavedCategory.toLowerCase());
    return `${sbar()}
      <div style="display:flex;align-items:center;gap:10px;padding:8px 16px">
        <button class="btn" onclick="currentSavedCategory=null;go('saved')" style="font-size:20px">‹</button>
        <span style="font-weight:600;font-size:15px">${currentSavedCategory} Collection</span>
      </div>
      <div style="padding:12px 16px;flex:1;overflow-y:auto">
        ${catItems.length === 0 ? `<div style="color:#666;font-size:12px;text-align:center;margin-top:40px">No items saved in ${currentSavedCategory} yet.<br>Go to Home Feed and tap 🏷️ on any post!</div>` : `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            ${catItems.map(item => `
              <div class="btn" onclick="triggerScoutOnItem(${item.id})" style="background:#141414;border:1px solid #222;border-radius:12px;padding:12px;text-align:left">
                <div style="font-size:36px;text-align:center;margin-bottom:6px">${item.icon}</div>
                <div style="font-size:11px;font-weight:600;color:#fff">${item.caption}</div>
                <div style="font-size:9px;color:#9333EA;margin-top:4px">✦ Scout & Shop</div>
              </div>
            `).join('')}
          </div>
        `}
      </div>`;
  }

  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">
    <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:15px">Saved Collections</span>
  </div>
  <div style="padding:12px 16px;flex:1;overflow-y:auto">
    <div class="category-grid">
      ${categories.map(cat => {
        const count = savedList.filter(p => p.category.toLowerCase() === cat.toLowerCase()).length;
        const theme = categoryThemes[cat];
        return `
          <div class="cat-thumb-card btn" onclick="currentSavedCategory='${cat}';go('saved')" style="background:${theme.bg}">
            <div style="font-size:32px;margin-bottom:4px">${theme.icon}</div>
            <div style="font-size:13px;font-weight:700;color:#fff">${cat}</div>
            <div style="font-size:10px;color:${theme.color};margin-top:2px;font-weight:600">${count} Bookmarks</div>
          </div>
        `;
      }).join('')}
    </div>
  </div>`;
}
};

function renderSearchResults(val) {
  const container = document.getElementById('searchResultsArea');
  if (!container) return;
  if (!val.trim()) {
    container.innerHTML = `
      <div style="text-align:center;padding:20px 16px">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px">✦</div>
        <div style="font-size:20px;font-weight:800">Instagram ${grad('Scout')}</div>
      </div>`;
    return;
  }

  const matches = initialPosts.filter(p => p.tags.some(t => t.toLowerCase().includes(val.toLowerCase())) || p.caption.toLowerCase().includes(val.toLowerCase()));
  container.innerHTML = `
    <div style="font-size:11px;color:#888;margin-bottom:10px">Found ${matches.length} matches for "${val}":</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${matches.map(p => `
        <div class="btn" onclick="triggerScoutOnItem(${p.id})" style="background:#141414;border:1px solid #222;border-radius:12px;padding:12px;text-align:left">
          <div style="font-size:32px;text-align:center;margin-bottom:4px">${p.icon}</div>
          <div style="font-size:11px;font-weight:600">${p.caption}</div>
        </div>
      `).join('')}
    </div>`;
}

go('home');
</script>
</body>
</html>
