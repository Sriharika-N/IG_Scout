/* Phone Frame Centered */

#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;position:relative}
#screen::-webkit-scrollbar{display:none}

/* Navigation & Header */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 8px;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:100;border-bottom:1px solid #111}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:10px}
.btn{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;outline:none}

@keyframes scanline{0%{top:0%}100%{top:100%}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadeup{animation:fadeup 0.3s ease forwards}

/* Instagram Stories Bar */
.stories-container{display:flex;gap:14px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;width:100%;border-bottom:1px solid #111;flex-shrink:0}
.stories-container::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.story-avatar{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);display:flex;align-items:center;justify-content:center}
.story-avatar-inner{width:100%;height:100%;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #000;overflow:hidden}

/* Feed Scroll */
.feed-container{flex:1;overflow-y:auto;scrollbar-width:none}
.feed-container::-webkit-scrollbar{display:none}

/* Feed Posts */
.ig-post{border-bottom:1px solid #181818;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ig-media{width:100%;height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:20px}
.ig-caption{padding:0 14px 12px;font-size:13px;line-height:1.4}

/* In-App Toast Notification */
#toast{position:absolute;bottom:75px;left:20px;right:20px;background:rgba(28,28,30,0.95);border:1px solid #9333EA88;color:#fff;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:600;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,0.8);z-index:200;backdrop-filter:blur(10px)}

.search-input{width:100%;background:#1c1c1e;border:1px solid #333;border-radius:12px;padding:10px 14px;color:#fff;font-size:13px;outline:none}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0}

function sbar(){ return `<div class="sbar"><span>9:41</span><span style="font-size:10px">●●●● WiFi 80%</span></div>`; }
function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }

function showToast(msg) {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  if (toast && toastMsg) {
    toastMsg.textContent = msg;
    toast.style.display = 'flex';
    setTimeout(() => { toast.style.display = 'none'; }, 2200);
  }
}

function go(s){
  const fn = screens[s];
  if(fn){ screen.innerHTML = fn(); }
}

function toggleSavePost(postId, btnEl) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.saved = !post.saved;
    btnEl.textContent = post.saved ? '🔖' : '🏷️';
    showToast(post.saved ? `✨ Saved to "${post.category}" Collection` : 'Removed from Saved Collection');
  }
}

function triggerScoutOnItem(postId) {
  const post = initialPosts.find(p => p.id === postId);
  if (!post) return;
  const mediaUrl = generateGraphicSVG(post.graphicTitle, post.icon, post.grad);
  userUploadedImage = mediaUrl;
  go('analyzing');
  executeScoutAnalysis(mediaUrl, post.caption, post.category);
}

function handleFileSelect(file) {
  if (!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const MAX_WIDTH = 600;
    const scaleSize = MAX_WIDTH / img.width;
    canvas.width = MAX_WIDTH;
    canvas.height = img.height * scaleSize;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    userUploadedImage = canvas.toDataURL('image/jpeg', 0.8);
    go('analyzing');
    executeScoutAnalysis(null, 'Custom Upload', 'Fashion');
  };
}

async function executeScoutAnalysis(imgUrl, searchQuery, categoryHint) {
  try {
    const res = await fetch('/api/scout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Data: userUploadedImage, imageUrl: imgUrl || searchQuery })
    });

    const data = await res.json();
    activeResult = data;
    go('results');

  } catch (err) {
    console.error('API Error:', err);
    activeResult = {
      aiAnalysis: {
        category: categoryHint || 'Food',
        summary: searchQuery || 'Authentic Regional Item',
        primaryLocation: 'Verified Location',
        confidence: 96,
        actionBtnText: '📍 Explore & Action Online',
        externalBuyUrl: `https://www.google.com/search?q=${encodeURIComponent(searchQuery || 'item search')}`
      }
    };
    go('results');
  }
}

          <span style="font-size:24px">🔖</span>
          <div><div style="font-weight:600;font-size:13px">Search Saved Items</div><div style="color:#9333EA;font-size:11px">Browse & shop from your bookmarks</div></div>
        </button>
      </div>
    </div>
  </div>`,

upload:()=>`${sbar()}
  <div style="display:flex;align-items:center;gap:10px;padding:8px 16px">
    <button class="btn" onclick="go('scout-landing')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:15px">Upload Photo</span>
  </div>
  <div style="padding:20px 16px">
    <input type="file" id="imgInp" accept="image/*" style="display:none" onchange="handleFileSelect(this.files[0])">
    <div onclick="document.getElementById('imgInp').click()" style="cursor:pointer;border:2px dashed #9333EA88;border-radius:20px;padding:40px 20px;text-align:center;background:#9333EA0A">
      <div style="font-size:40px;margin-bottom:10px">📤</div>
      <div style="font-weight:600;font-size:14px">Choose Photo from Device</div>
      <div style="color:#666;font-size:11px;margin-top:4px">Fashion · Literature · Food · Travel</div>
    </div>
  </div>`,

analyzing:()=>`${sbar()}
  <div style="height:580px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center">
    <div style="width:150px;height:150px;border-radius:20px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;margin-bottom:16px;overflow:hidden">
      ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : '✦'}
      <div style="position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#9333EA,#EC4899,transparent);animation:scanline 1.5s linear infinite;top:0"></div>
    </div>
    <div style="font-weight:700;font-size:15px">Gemini AI & Google Lens Searching...</div>
    <div style="color:#666;font-size:11px;margin-top:4px">Extracting visual matches & web store links</div>
  </div>`,

results:()=>{
  const ai = activeResult.aiAnalysis;
  const det = ai.details || {};

  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">
    <button class="btn" onclick="go('saved')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:14px">Scout Results</span>
    <span style="background:#9333EA22;color:#9333EA;font-size:9px;padding:3px 8px;border-radius:10px;font-weight:700">${ai.confidence}% MATCH</span>
  </div>
  <div style="padding:14px;overflow-y:auto;flex:1">
    <div style="border-radius:16px;height:180px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden">
      ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : '✦'}
    </div>

    <div style="background:#141414;border:1px solid #9333EA44;padding:12px;border-radius:12px;margin-bottom:10px">
      <div style="color:#9333EA;font-size:10px;font-weight:700">✦ CATEGORY: ${ai.category.toUpperCase()}</div>
      <div style="font-weight:600;font-size:14px;margin-top:2px">${ai.summary}</div>
      ${ai.primaryLocation ? `<div style="font-size:11px;color:#888;margin-top:4px">📍 Location: <b>${ai.primaryLocation}</b></div>` : ''}
      ${det.itemName ? `<div style="font-size:12px;color:#eee;margin-top:4px">Item: ${det.itemName}</div>` : ''}
    </div>

    <button class="btn" onclick="window.open('${ai.externalBuyUrl}', '_blank')" style="width:100%;background:linear-gradient(135deg,#9333EA,#EC4899);padding:12px;border-radius:12px;font-weight:700;font-size:12px;margin-bottom:12px;color:#fff">
      ${ai.actionBtnText || '📍 Explore & Action Online'}
    </button>

    <div class="ad-card">
      <div>
        <div style="font-size:9px;color:#9333EA;font-weight:700">SPONSORED PLACEMENT</div>
        <div style="font-size:11px;font-weight:600">Exclusive 20% discount on reservation/purchase</div>
      </div>
      <button class="btn" onclick="window.open('${ai.externalBuyUrl}', '_blank')" style="background:#60a5fa22;color:#60a5fa;font-size:10px;padding:6px 12px;border-radius:8px">View</button>
    </div>
  </div>`;
},

saved:()=>{
  const savedList = initialPosts.filter(p => p.saved);
  const categories = ['Fashion', 'Food', 'Travel', 'Literature', 'Architecture'];

  if (currentSavedCategory) {
    const catItems = savedList.filter(p => p.category.toLowerCase() === currentSavedCategory.toLowerCase());
    return `${sbar()}
      <div style="display:flex;align-items:center;gap:10px;padding:8px 16px">
        <button class="btn" onclick="currentSavedCategory=null;go('saved')" style="font-size:20px">‹</button>
        <span style="font-weight:600;font-size:15px">${currentSavedCategory} Collection</span>
      </div>
      <div style="padding:12px 16px;flex:1;overflow-y:auto">
        ${catItems.length === 0 ? `<div style="color:#666;font-size:12px;text-align:center;margin-top:40px">No items saved in ${currentSavedCategory} yet.<br>Go to Home Feed and tap 🏷️ on any post!</div>` : `
          <div class="category-grid">
            ${catItems.map(item => {
              const svg = generateGraphicSVG(item.graphicTitle, item.icon, item.grad);
              return `
                <div class="thumb-card cat-card" onclick="triggerScoutOnItem(${item.id})" style="background:linear-gradient(135deg,#1c1c1e,#2c2c2e)">
                  <div style="font-size:28px">${item.icon}</div>
                  <div style="font-size:11px;font-weight:700;color:#fff">${item.caption}</div>
                  <div style="font-size:9px;color:#9333EA">✦ Scout AI</div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>`;
  }

  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">
    <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:15px">Saved Collections</span>
  </div>
  <div style="padding:12px 16px;flex:1;overflow-y:auto">
    <div class="category-grid">
      ${categories.map(cat => {
        const count = savedList.filter(p => p.category.toLowerCase() === cat.toLowerCase()).length;
        const theme = categoryThemes[cat];
        return `
          <div class="cat-card btn" onclick="currentSavedCategory='${cat}';go('saved')" style="background:${theme.bg}">
            <div style="font-size:32px">${theme.icon}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#fff">${cat}</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.7);margin-top:2px;font-weight:600">${count} Bookmarks</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  </div>`;
}
};

function renderSearchResults(val) {
  const container = document.getElementById('searchResultsArea');
  if (!container) return;
  if (!val.trim()) {
    container.innerHTML = `
      <div style="text-align:center;padding:20px 16px">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px">✦</div>
        <div style="font-size:20px;font-weight:800">Instagram ${grad('Scout')}</div>
      </div>`;
    return;
  }

  const matches = initialPosts.filter(p => p.tags.some(t => t.toLowerCase().includes(val.toLowerCase())) || p.caption.toLowerCase().includes(val.toLowerCase()));
  container.innerHTML = `
    <div style="font-size:11px;color:#888;margin-bottom:10px">Found ${matches.length} matches for "${val}":</div>
    <div class="category-grid">
      ${matches.map(p => `
        <div class="cat-card btn" onclick="triggerScoutOnItem(${p.id})" style="background:linear-gradient(135deg,#1c1c1e,#2c2c2e);min-height:100px">
          <div style="font-size:28px">${p.icon}</div>
          <div style="font-size:11px;font-weight:600">${p.caption}</div>
        </div>
      `).join('')}
    </div>`;
}

go('home');
</script>
</body>
</html>
