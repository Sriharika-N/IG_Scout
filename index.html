<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Scout — AI Visual Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;color:#fff;padding:10px}

/* Phone Mockup Frame */
#phone{width:390px;height:844px;background:#000;border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 20px 60px rgba(147,51,234,0.3);position:relative;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;position:relative}
#screen::-webkit-scrollbar{display:none}

/* Top & Bottom Navigation Bars */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 8px;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:100;border-bottom:1px solid #111}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:10px}

.btn{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;outline:none}
@keyframes scanline{0%{top:0%}100%{top:100%}}

/* Instagram Stories Bar */
.stories-container{display:flex;gap:14px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;width:100%;border-bottom:1px solid #111;flex-shrink:0}
.stories-container::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.story-avatar{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);display:flex;align-items:center;justify-content:center}
.story-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000}

/* Feed Scroll Container */
.feed-container{flex:1;overflow-y:auto;scrollbar-width:none}
.feed-container::-webkit-scrollbar{display:none}

/* Instagram Post Layout */
.ig-post{border-bottom:1px solid #181818;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ig-media{width:100%;height:340px;background:#141414;overflow:hidden}
.ig-media img{width:100%;height:100%;object-fit:cover}
.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:20px}
.ig-caption{padding:0 14px 12px;font-size:13px;line-height:1.4}

.tag{display:inline-block;padding:4px 8px;border-radius:8px;font-size:10px;background:#9333EA22;color:#ec4899;border:1px solid #9333EA44;margin:4px 4px 0 0}
.ad-badge{background:linear-gradient(135deg,#1c1917,#2e1065);border:1px solid #9333EA66;padding:12px;border-radius:14px;margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.search-input{width:100%;background:#1c1c1e;border:1px solid #333;border-radius:10px;padding:10px 14px;color:#fff;font-size:13px;outline:none;margin-bottom:12px}
</style>
</head>
<body>

<div id="phone">
  <div id="screen"></div>
  <div class="bottom-nav">
    <button class="btn" onclick="go('home')"><span style="font-size:22px">🏠</span></button>
    <button class="btn" onclick="go('scout-landing')" style="position:relative">
      <span style="font-size:22px">🔍</span>
      <div style="position:absolute;top:-2px;right:-4px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#9333EA,#EC4899);border:2px solid #000"></div>
    </button>
    <button class="btn" onclick="go('saved')" title="Saved Collection"><span style="font-size:20px">🔖</span></button>
    <button class="btn" onclick="go('upload')"><span style="font-size:22px">➕</span></button>
    <div style="width:24px;height:24px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">S</div>
  </div>
</div>

  { id: 14, username: 'design_journal', location: 'Barcelona, Spain', userImg: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1511527656417-089565a5e8ce?w=600&q=80', caption: 'Gothic Quarter Architecture 🏛️', category: 'Architecture', saved: false, tags: ['architecture', 'spain'] },

  { id: 18, username: 'nordic_living', location: 'Copenhagen, Denmark', userImg: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600&q=80', caption: 'Scandinavian Minimalist Interior 🛋️', category: 'Architecture', saved: false, tags: ['architecture', 'interior'] },
  { id: 19, username: 'sunset_chaser', location: 'Reykjavik, Iceland', userImg: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1504893524553-b855bce32c67?w=600&q=80', caption: 'Icelandic Waterfalls & Landscapes 🏔️', category: 'Travel', saved: false, tags: ['travel', 'iceland'] },
  { id: 20, username: 'haute_couture', location: 'Paris, France', userImg: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80', mediaImg: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=600&q=80', caption: 'Parisian Designer Trench Coat 🧥', category: 'Fashion', saved: false, tags: ['coat', 'fashion', 'trench'] }
];

function sbar(){ return `<div class="sbar"><span>9:41</span><span style="font-size:10px">●●●● WiFi 80%</span></div>`; }
function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }

function go(s){
  const fn = screens[s];
  if(fn){
    screen.innerHTML = fn();
    screen.scrollTop = 0;
  }
}

function toggleSavePost(postId) {
  const post = initialPosts.find(p => p.id === postId);
  if (post) {
    post.saved = !post.saved;
    alert(post.saved ? `✨ Bookmarked & Saved to "${post.category}" Collection!` : 'Removed from Saved Items');
    go('home');
  }
}

function triggerScoutOnImage(imageUrl) {
  userUploadedImage = imageUrl;
  go('analyzing');
  executeScoutAnalysis();
}

function handleFileSelect(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    userUploadedImage = e.target.result;
    go('analyzing');
    executeScoutAnalysis();
  };
  reader.readAsDataURL(file);
}

async function executeScoutAnalysis() {
  try {
    const res = await fetch('/api/scout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Data: userUploadedImage })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error);

    activeResult = data;
    go('results');

  } catch (err) {
    console.error('API Error:', err);
    alert('Analysis failed. Check your Gemini API key in Vercel settings.');
    go('home');
  }
}

const screens = {
home:()=>`${sbar()}

          <div style="display:flex;align-items:center;gap:10px">
            <div class="story-avatar" style="width:32px;height:32px"><img src="${p.userImg}"/></div>
            <div>

            </div>
          </div>
        </div>
        <div class="ig-media" onclick="triggerScoutOnImage('${p.mediaImg}')" style="cursor:pointer">
          <img src="${p.mediaImg}"/>
        </div>
        <div class="ig-actions">
          <div style="display:flex;gap:14px"><span>♥</span><span>💬</span><span>↗</span></div>
          <button class="btn" onclick="toggleSavePost(${p.id})">${p.saved ? '🔖' : '🏷️'}</button>
        </div>
        <div class="ig-caption">
          <b>${p.username}</b> ${p.caption}
          <div style="font-size:10px;color:#9333EA;margin-top:4px;cursor:pointer" onclick="triggerScoutOnImage('${p.mediaImg}')">✦ Tap photo to Scout & Shop with AI</div>
        </div>
      </div>
    `).join('')}
  </div>`,

'scout-landing':()=>`${sbar()}
  <div style="display:flex;align-items:center;gap:10px;padding:8px 16px">
    <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>
    <div style="flex:1">
      <input type="text" class="search-input" placeholder="🔍 Search 'dresses', 'books', 'pasta'..." value="${searchQuery}" oninput="searchQuery=this.value;go('scout-landing')">

  </div>

    <div style="padding:0 16px 16px;flex:1;overflow-y:auto">

          </div>

results:()=>{
  const ai = activeResult.aiAnalysis;
  const det = ai.details || {};
  const isFashion = ai.category === 'Fashion';
  const isBook = ai.category === 'Literature';

  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">

  </div>
  <div style="padding:14px;overflow-y:auto;flex:1">
    <div style="border-radius:16px;overflow:hidden;height:180px;background:#181818;margin-bottom:10px">

    <div style="background:#141414;border:1px solid #9333EA44;padding:12px;border-radius:12px;margin-bottom:10px">
      <div style="color:#9333EA;font-size:10px;font-weight:700">✦ CATEGORY: ${ai.category.toUpperCase()}</div>
      <div style="font-weight:600;font-size:14px;margin-top:2px">${ai.summary}</div>
      
      ${det.garmentOrBookName ? `<div style="font-size:12px;color:#eee;margin-top:6px"><b>Item:</b> ${det.garmentOrBookName}</div>` : ''}
      ${det.color ? `<div style="font-size:11px;color:#888;margin-top:2px">Color / Style: ${det.color} · ${det.styleOrGenre || ''}</div>` : ''}
      
      ${det.keyAttributes ? `
        <div style="margin-top:8px">${det.keyAttributes.map(a => `<span class="tag">${a}</span>`).join('')}</div>
      ` : ''}
    </div>

    <a href="${ai.externalBuyUrl}" target="_blank" style="text-decoration:none">
      <button class="btn" style="width:100%;background:linear-gradient(135deg,#9333EA,#EC4899);padding:12px;border-radius:12px;font-weight:700;font-size:12px;margin-bottom:12px;color:#fff">
        ${isFashion ? '🛒 Search & Shop Garment Online' : isBook ? '📚 Buy Book Online' : '📍 Explore Location Online'}
      </button>
    </a>

    <div class="ad-badge">
      <div>
        <div style="font-size:9px;color:#9333EA;font-weight:700">SPONSORED PLACEMENT</div>
        <div style="font-size:11px;font-weight:600">${isFashion ? 'Trending styles up to 30% off' : 'Get fast delivery on books'}</div>
      </div>
      <a href="${ai.externalBuyUrl}" target="_blank" style="text-decoration:none">
        <button class="btn" style="background:#60a5fa22;color:#60a5fa;font-size:10px;padding:6px 12px;border-radius:8px">View</button>
      </a>
    </div>
  </div>`;
},

saved:()=>{
  const savedList = initialPosts.filter(p => p.saved);
  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">
    <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:15px">Saved Items (${savedList.length})</span>
  </div>
  <div style="padding:12px 16px;flex:1;overflow-y:auto">
    ${savedList.length === 0 ? `
      <div style="text-align:center;color:#666;font-size:12px;margin-top:40px">
        No saved items yet!<br>Go to the Home Feed and tap 🏷️ to bookmark posts.
      </div>
    ` : `
      <div style="color:#888;font-size:11px;margin-bottom:12px">Tap any saved item below to run Scout AI analysis & get shopping links!</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${savedList.map(item => `
          <div class="btn" onclick="triggerScoutOnImage('${item.mediaImg}')" style="background:#141414;border:1px solid #222;border-radius:12px;overflow:hidden;text-align:left">
            <div style="height:110px;background:#222"><img src="${item.mediaImg}" style="width:100%;height:100%;object-fit:cover"/></div>
            <div style="padding:8px">
              <div style="font-size:11px;font-weight:600">${item.caption}</div>
              <div style="font-size:9px;color:#9333EA;margin-top:2px">✦ Scout & Shop</div>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  </div>`;
}
};

go('home');
</script>
</body>
</html>
