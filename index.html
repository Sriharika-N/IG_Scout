.tcard:active{transform:scale(.97)}
.tcard img{width:100%;height:130px;object-fit:cover;display:block}
.scard{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.scard:hover{border-color:rgba(147,51,234,.4)}
.scard img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#1a1a1a}
.abadge{padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;background:#9333EA;color:#fff;border:none;cursor:pointer;white-space:nowrap}
#toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;border:1px solid rgba(147,51,234,.7);padding:8px 16px;border-radius:20px;font-size:11px;font-weight:600;display:none;z-index:200;white-space:nowrap}
.arow{display:flex;align-items:center;gap:10px;padding:8px 16px 4px}
.bk{font-size:24px;cursor:pointer;background:none;border:none;color:#fff;padding:0 4px;line-height:1}
.ttl{font-weight:600;font-size:15px;color:#fff}
.actbtn{display:flex;align-items:center;gap:12px;background:#111;border-radius:14px;padding:12px;border:1px solid #222;width:100%;cursor:pointer;color:#fff;text-align:left;margin-bottom:8px;font-family:inherit;transition:border-color .15s}

    + '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function svgAvatar(name, bg) {

}

// ── ROUTING ──
function go(s,back){
  if(s==='saved'&&!back)savedCat=null;
  if(s==='home'){userImg2=null;var fks=Object.keys(flows);for(var i=0;i<fks.length;i++)delete flows[fks[i]]._lensLabel;}
  if(!back&&stack[stack.length-1]!==s)stack.push(s);
  var fn=screens[s];if(fn){S.innerHTML=fn();S.scrollTop=0;attachEvents(s);}
}
function goBack(){
  if(stack.length>1){stack.pop();var p=stack[stack.length-1];var fn=screens[p];if(fn){S.innerHTML=fn();S.scrollTop=0;attachEvents(p);}}
}
function openLink(url){if(url)window.open(url,'_blank','noopener,noreferrer')}
function toggleLike(id,el){var p=posts.find(function(x){return x.id===id});if(!p)return;p.liked=!p.liked;el.innerHTML=heartSVG(p.liked)}
function toggleSave(id,el){
  var p=posts.find(function(x){return x.id===id});if(!p)return;
  p.saved=!p.saved;el.innerHTML=bookSVG(p.saved);
  showToast(p.saved?'🔖 Saved to '+capFirst(p.cat)+' collection':'Removed from saves');
}
function scoutPost(id){
  var p=posts.find(function(x){return x.id===id});if(!p)return;
  userImg2=p.img;activeFlow=flows[p.flow]||null;
  if(!activeFlow){showToast('Scout not available for this post');return}
  go('analyzing');
}
function demoScout(flowKey){
  userImg2=null;activeFlow=flows[flowKey]||flows.travel_paris;go('analyzing');
}

function doSearch(val){
  var area=document.getElementById('sarea');if(!area)return;
  if(!val.trim()){area.innerHTML=scoutHomeHTML();return}
  var v=val.toLowerCase();
  var matches=posts.filter(function(p){return p.tags.some(function(t){return t.indexOf(v)>-1})||p.cap.toLowerCase().indexOf(v)>-1});
  var h='<div style="padding:0 16px;margin-bottom:10px;font-size:11px;color:#888">Found <b style="color:#fff">'+matches.length+'</b> result'+(matches.length!==1?'s':'')+' for "<b style="color:#a855f7">'+val+'</b>"</div>';
  if(!matches.length){h+='<div style="color:#666;font-size:12px;text-align:center;padding:30px">No results. Try "sapiens", "blazer", "pasta", or "paris".</div>';}
  else{
    h+='<div class="grid2">';
    matches.forEach(function(p){
      h+='<div class="tcard" onclick="scoutPost('+p.id+')">'
        +'<img src="'+p.img+'" style="height:130px;object-fit:cover"/>'
        +'<div style="padding:8px"><div style="font-size:11px;font-weight:600;line-height:1.3">'+p.cap+'</div>'
        +'<div style="font-size:9px;color:#a855f7;margin-top:3px">'+capFirst(p.cat)+'</div></div>'
        +'</div>';
    });
    h+='</div>';
  }
  area.innerHTML=h;
}

var kwFlows={
  'eiffel tower':'travel_paris','paris':'travel_paris',
  'santorini':'travel_santorini','oia':'travel_santorini','greece':'travel_santorini',
  'bali':'travel_bali','ubud':'travel_bali','rice terrace':'travel_bali',
  'kyoto':'travel_kyoto','fushimi inari':'travel_kyoto','torii':'travel_kyoto','japan':'travel_kyoto',
  'venice':'travel_venice','grand canal':'travel_venice','gondola':'travel_venice',
  'pasta':'food_rome','cacio e pepe':'food_rome','rome':'food_rome',
  'sushi':'food_sushi','nigiri':'food_sushi','tokyo':'food_sushi',
  'pizza':'food_pizza','margherita':'food_pizza','naples':'food_pizza',
  'ramen':'food_ramen','tonkotsu':'food_ramen','ichiran':'food_ramen',
  'croissant':'food_paris','pastry':'food_paris','patisserie':'food_paris',
  'white blazer':'fashion_blazer','linen blazer':'fashion_blazer','blazer':'fashion_blazer',
  'camel coat':'fashion_camelcoat','wool coat':'fashion_camelcoat',
  'trench coat':'fashion_trench','trench':'fashion_trench',
  'denim':'fashion_denim','jeans':'fashion_denim',
  'bomber jacket':'fashion_bomber','bomber':'fashion_bomber','streetwear':'fashion_bomber',
  'sapiens':'lit_sapiens','yuval harari':'lit_sapiens',
  'atomic habits':'lit_atomichabits','james clear':'lit_atomichabits',
  'psychology of money':'lit_psychmoney','morgan housel':'lit_psychmoney',
  'deep work':'lit_deepwork','cal newport':'lit_deepwork',
  'steve jobs':'lit_stevejobs','isaacson':'lit_stevejobs',
};

function detectFlow(text){
  var t=text.toLowerCase();
  var keys=Object.keys(kwFlows);
  for(var i=0;i<keys.length;i++){if(t.indexOf(keys[i])>-1)return kwFlows[keys[i]];}
  if(t.indexOf('travel')>-1||t.indexOf('landmark')>-1)return 'travel_paris';
  if(t.indexOf('food')>-1||t.indexOf('dish')>-1)return 'food_rome';
  if(t.indexOf('fashion')>-1||t.indexOf('outfit')>-1)return 'fashion_blazer';
  if(t.indexOf('book')>-1)return 'lit_sapiens';
  return 'travel_paris';
}

function handleFile(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    userImg2=e.target.result;
    var parts=e.target.result.split(',');
    var b64=parts[1];
    var mime=parts[0].indexOf('png')>-1?'image/png':parts[0].indexOf('webp')>-1?'image/webp':'image/jpeg';
    activeFlow=flows.travel_paris;
    go('analyzing');
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:b64}},
          {type:'text',text:'You are Google Lens with 99% accuracy. Analyze this image and identify: 1) The exact subject. 2) Category. Reply concisely.'}
        ]}]
      })
    }).then(function(res){return res.json()}).then(function(data){
      var text=(data.content&&data.content[0])?data.content[0].text:'';
      if(text){
        var fk=detectFlow(text);
        activeFlow=flows[fk]||flows.travel_paris;
        activeFlow._lensLabel=text;
      }
    }).catch(function(err){console.warn('Vision API error:',err)});
  };
  r.readAsDataURL(file);
}

function attachEvents(s){
  if(s==='analyzing'){
    var p=0,bar=document.getElementById('pbar'),num=document.getElementById('pnum'),items=document.querySelectorAll('.step-item');
    var iv=setInterval(function(){
      p=Math.min(p+4,95);
      if(bar)bar.style.width=p+'%';
      if(num)num.textContent=p+'%';
      var done=Math.floor(p/25);
      items.forEach(function(it,i){
        var dot=it.querySelector('.sdot');var lbl=it.querySelector('.slbl');
        if(i<done){
          it.style.opacity='1';
          if(dot){dot.style.background='#22c55e';dot.innerHTML='<svg width="8" height="8" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
          if(lbl)lbl.style.color='#22c55e';
        } else if(i===done){
          it.style.opacity='1';
          if(dot){dot.style.background='#EC4899';dot.innerHTML='';}
          if(lbl)lbl.style.color='#fff';
        } else {
          it.style.opacity='0.25';
        }
      });
    },60);
    setTimeout(function(){
      clearInterval(iv);
      if(bar)bar.style.width='100%';if(num)num.textContent='100%';
      items.forEach(function(it){
        var dot=it.querySelector('.sdot');var lbl=it.querySelector('.slbl');
        it.style.opacity='1';
        if(dot){dot.style.background='#22c55e';dot.innerHTML='<svg width="8" height="8" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
        if(lbl)lbl.style.color='#22c55e';
      });
      setTimeout(function(){go('results')},400);
    },2200);
  }
}
