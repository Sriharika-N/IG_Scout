.ig-caption{padding:0 14px 14px;font-size:13px;line-height:1.4}

.grid-container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.thumb-card{background:#121212;border:1px solid #222;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform 0.15s ease}
.thumb-card:active{transform:scale(0.97)}
.thumb-card img{width:100%;height:130px;object-fit:cover;display:block}
.sub-card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.sub-card img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0}

  if(!isBack && navStack[navStack.length-1]!==s) navStack.push(s);

}
function openLink(url){if(url)window.open(url,'_blank','noopener,noreferrer')}

      <div style="margin-top:3px;display:inline-block;padding:2px 7px;background:#F59E0B22;color:#F59E0B;border-radius:8px;font-size:9px;font-weight:600">${item.badge}</div>
    </div>
    <button class="action-badge" style="background:#EC4899" onclick="openLink('${item.link}')">Shop →</button>
  </div>`).join('')}
</div>`,

'sub-plan':()=>{
  const flow=activeFlow||flows.fashion;
  const day=flow.planDays[activeDayTab]||flow.planDays[1];
  return`${sbar()}
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px 4px">
  <button class="btn" id="back" style="font-size:22px">‹</button>
  <span style="font-weight:600;font-size:15px">${flow.planTitle}</span>
</div>
<div style="padding:10px 16px">
  <div style="display:flex;gap:8px;margin-bottom:14px;background:#111;padding:4px;border-radius:12px;border:1px solid #222">
    ${[1,2,3].map(d=>`
    <button class="btn" onclick="activeDayTab=${d};go('sub-plan')" style="flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:600;background:${activeDayTab===d?'linear-gradient(135deg,#9333EA,#EC4899)':'transparent'};color:${activeDayTab===d?'#fff':'#888'}">
      Day ${d}
    </button>`).join('')}
  </div>
  <div style="background:#111;border:1px solid #222;border-radius:16px;padding:16px">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px">${day.title}</div>
    <div style="font-size:12px;color:#aaa;line-height:1.6">${day.details}</div>
  </div>
</div>`,

saved:()=>{
  const savedList=initialPosts.filter(p=>p.saved);
  const cats=['Literature','Food','Fashion','Travel'];
  if(currentSavedCategory){
    const items=savedList.filter(p=>p.category===currentSavedCategory);
    return`${sbar()}
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px 4px">
  <button class="btn" onclick="currentSavedCategory=null;go('saved')" style="font-size:22px">‹</button>
  <span style="font-weight:600;font-size:15px">${currentSavedCategory} Collection</span>
</div>
<div style="padding:10px 16px">
  ${items.length===0?`<div style="color:#666;font-size:12px;text-align:center;margin-top:40px">Nothing saved in ${currentSavedCategory} yet.</div>`:`
  <div class="grid-container">
    ${items.map(item=>`
    <div class="thumb-card" onclick="scoutPost(${item.id})">
      <img src="${item.mediaImg}" referrerpolicy="no-referrer-when-downgrade"/>
      <div style="padding:8px"><div style="font-size:11px;font-weight:600;line-height:1.3">${item.caption}</div></div>
    </div>`).join('')}
  </div>`}
</div>`}
  return`${sbar()}
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px 4px">
  <button class="btn" id="back" style="font-size:22px">‹</button>
  <span style="font-weight:600;font-size:15px">Saved Collections</span>
</div>
<div style="padding:10px 14px">
  <div class="grid-container">
    ${cats.map(cat=>{
      const count=savedList.filter(p=>p.category===cat).length;
      return`<div class="thumb-card" onclick="currentSavedCategory='${cat}';go('saved')">
        <img src="${catCovers[cat]}" referrerpolicy="no-referrer-when-downgrade"/>
        <div style="padding:8px">
          <div style="font-size:12px;font-weight:700">${cat}</div>
          <div style="font-size:10px;color:#a855f7;margin-top:2px;font-weight:600">${count} Saved</div>
        </div>
      </div>`;
    }).join('')}
  </div>
</div>`},
};

// ── SEARCH ─────────────────────────────────────────────────────────────────
function scoutHome(){return`
<div style="text-align:center;padding:28px 24px 20px">
  <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;position:relative">
    ✦<div style="position:absolute;top:-4px;right:-4px;background:#000;border-radius:20px;padding:1px 5px;font-size:9px;font-weight:700;color:#9333EA;border:1px solid #9333EA44">AI</div>
  </div>
  <div style="font-size:24px;font-weight:800;margin-bottom:4px">Instagram ${grad('Scout')}</div>
  <div style="color:#888;font-size:12px">Visual AI Search — Books, Food, Fashion & Travel</div>
</div>
<div style="padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
  ${[
    {icon:'📷',label:'Upload from Camera Roll',sub:'Search anything in your photos',screen:'upload',border:'#9333EA33'},
    {icon:'📚',label:'Browse Books',sub:'Find & buy any book',screen:'upload',border:'#EC489933'},
    {icon:'🔖',label:'Search Saved Posts',sub:'Explore your saved collection',screen:'saved',border:'#F59E0B33'},
  ].map(b=>`
  <button class="btn" onclick="go('${b.screen}')" style="display:flex;align-items:center;gap:12px;background:#111;border-radius:16px;padding:14px;border:1px solid ${b.border};width:100%">
    <div style="width:44px;height:44px;border-radius:12px;background:${b.border};display:flex;align-items:center;justify-content:center;font-size:20px">${b.icon}</div>
    <div style="text-align:left;flex:1"><div style="font-weight:600;font-size:13px">${b.label}</div><div style="color:#666;font-size:11px;margin-top:2px">${b.sub}</div></div>
    <span style="color:#555;font-size:18px">›</span>
  </button>`).join('')}
</div>`}

function renderSearch(val){
  const area=document.getElementById('searchArea');
  if(!area)return;
  if(!val.trim()){area.innerHTML=scoutHome();return}
  const matches=initialPosts.filter(p=>p.tags.some(t=>t.includes(val.toLowerCase()))||p.caption.toLowerCase().includes(val.toLowerCase()));
  area.innerHTML=`
<div style="padding:0 16px;margin-bottom:10px;font-size:11px;color:#888">Found <b style="color:#fff">${matches.length}</b> result${matches.length!==1?'s':''} for "<b style="color:#a855f7">${val}</b>"</div>
<div class="grid-container">
  ${matches.length===0?`<div style="grid-column:1/span 2;color:#666;font-size:12px;text-align:center;padding:30px">No results. Try "sapiens", "blazer", "pasta", or "paris".</div>`:matches.map(p=>`
  <div class="thumb-card" onclick="scoutPost(${p.id})">
    <img src="${p.mediaImg}" referrerpolicy="no-referrer-when-downgrade"/>
    <div style="padding:8px">
      <div style="font-size:11px;font-weight:600;line-height:1.3">${p.caption}</div>
      <div style="font-size:9px;color:#a855f7;margin-top:3px">${p.category}</div>
    </div>
  </div>`).join('')}
</div>`}

function handleFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{userUploadedImage=e.target.result;activeFlow=flows.fashion;go('analyzing')};
  r.readAsDataURL(file);
}

function attachEvents(s){
  const b=document.getElementById('back');
  if(b) b.onclick=()=>{if(navStack.length>1){navStack.pop();go(navStack[navStack.length-1],true)}else go('home',true)};
  if(s==='analyzing'){
    let p=0;
    const bar=document.getElementById('progbar'),num=document.getElementById('prognum'),items=document.querySelectorAll('.step-item');
    const iv=setInterval(()=>{
      p=Math.min(p+5,95);
      if(bar)bar.style.width=p+'%';
      if(num)num.textContent=p+'%';
      items.forEach((it,i)=>{if(i<=Math.floor(p/25))it.style.opacity='1'});
    },50);
    setTimeout(()=>{clearInterval(iv);if(bar)bar.style.width='100%';if(num)num.textContent='100%';setTimeout(()=>go('results'),250)},1800);
  }
}

go('home');
</script>
</body>
</html>
