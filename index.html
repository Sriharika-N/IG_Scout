<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Scout — AI Visual Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#0d0d0d;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;padding:20px}

/* Phone Mockup Frame */
#phone{width:390px;height:844px;background:#000;border-radius:48px;overflow:hidden;box-shadow:0 0 0 12px #1c1c1e,0 0 0 14px #2c2c2e,0 30px 90px rgba(147,51,234,0.35);position:relative;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column}
#screen::-webkit-scrollbar{display:none}

/* Sticky Header & Navigation Bars */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 6px;font-size:12px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:100}
.bottom-nav{height:65px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;width:100%;z-index:100;padding-bottom:10px}

.btn{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;outline:none}
.sidebar{max-width:280px}
@keyframes scanline{0%{top:0%}100%{top:100%}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadeup{animation:fadeup 0.3s ease forwards}

/* Instagram Post Layout Styles */
.ig-post{border-bottom:1px solid #181818;margin-bottom:12px;background:#000}
.ig-post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.ig-avatar{width:34px;height:34px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);display:flex;align-items:center;justify-content:center}
.ig-avatar-inner{width:100%;height:100%;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #000}
.ig-media{width:100%;height:320px;background:#161616;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden}
.ig-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:20px}
.ig-caption{padding:0 14px 12px;font-size:13px;line-height:1.4}
</style>
</head>
<body>

<div id="phone">
  <div id="screen"></div>
  <div class="bottom-nav">
    <button class="btn" onclick="go('home')"><span style="font-size:22px">🏠</span></button>
    <button class="btn" id="scoutBtn" onclick="go('scout-landing')" style="position:relative">
      <span style="font-size:22px">🔍</span>
      <div style="position:absolute;top:-2px;right:-4px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#9333EA,#EC4899);border:2px solid #000"></div>
    </button>
    <button class="btn" onclick="go('upload')"><span style="font-size:22px">➕</span></button>
    <button class="btn" onclick="go('saved')"><span style="font-size:20px">🔖</span></button>
    <div style="width:24px;height:24px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">S</div>
  </div>
</div>

<div class="sidebar">
  <div style="font-size:24px;font-weight:800;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px">Instagram Scout</div>
  <div style="color:#888;font-size:13px;line-height:1.6;margin-bottom:16px">AI-powered visual search demo for global client presentation.</div>
  <div style="padding:12px;border-radius:12px;background:#1a1a1a;border:1px solid #333">
    <div style="color:#555;font-size:10px;margin-bottom:3px;text-transform:uppercase;letter-spacing:1px">Current Screen</div>
    <div id="screenLabel" style="color:#fff;font-size:13px;font-weight:600">Home Feed</div>
  </div>
</div>

<script>
const screen = document.getElementById('screen');
const labelEl = document.getElementById('screenLabel');

let currentCat = 'food';
let userUploadedImage = null;

let mockData = {
  food:{label:'Cacio e Pepe at Trattoria Da Enzo (Rome, Italy)',emoji:'🍝',bg:'#2d1510',nearby:[{n:'Trattoria Da Enzo',d:'0.1 km',r:'4.8',p:'€€',e:'🍝'},{n:'Tonnarello',d:'0.4 km',r:'4.7',p:'€€',e:'🍷'}],shop:[{n:'Artisanal Pecorino Romano',b:'Eataly',p:'$24',r:'4.9',e:'🧀',badge:'Top Rated'}],saves:[{t:'reel',l:'Best Pasta in Trastevere',u:'@rome_eats'}]},
  fashion:{label:'Structured White Linen Suit & Blazer (Milan, Italy)',emoji:'👗',bg:'#1e1e1e',nearby:[{n:'Zara Flagship Corso Vittorio',d:'0.3 km',r:'4.6',p:'€€€',e:'👗'}],shop:[{n:'Linen Blend Blazer',b:'Zara',p:'$89',r:'4.6',e:'🧥',badge:'Trending'}],saves:[{t:'post',l:'Milan Fashion Week Streetwear',u:'@style_milan'}]},
  travel:{label:'Oia Castle Overlook & Blue Domes (Santorini, Greece)',emoji:'🏛️',bg:'#1a2a4a',nearby:[{n:'Kastro Oia Restaurant',d:'0.2 km',r:'4.9',p:'€€€€',e:'🏛️'}],shop:[{n:'Santorini Island Catamaran Tour',b:'GetYourGuide',p:'$140',r:'4.8',e:'⛵',badge:'Bestseller'}],saves:[{t:'reel',l:'Santorini Hidden Spots',u:'@traveler_life'}]}
};

function sbar(){ return `<div class="sbar"><span>9:41</span><span style="font-size:10px">●●●● WiFi 80%</span></div>`; }
function grad(txt){ return `<span style="background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${txt}</span>`; }

function go(s, cat){
  if(cat) currentCat = cat;
  labelEl.textContent = s;
  const fn = screens[s];
  if(fn){
    screen.innerHTML = fn();
    screen.scrollTop = 0;
    attachEvents(s);
  }
}

async function processUserFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    userUploadedImage = e.target.result;
    go('analyzing');

    try {
      const res = await fetch('/api/scout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base64Data: userUploadedImage })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const ai = data.aiAnalysis;
      currentCat = ai.category || 'fashion';

      mockData[currentCat] = {
        label: `${ai.summary} — ${ai.exactLocation || ai.city}`,
        emoji: currentCat === 'fashion' ? '👗' : currentCat === 'food' ? '🍝' : '🏛️',
        bg: '#1a1a1a',
        confidence: ai.confidence || 97,
        nearby: data.venues.length > 0 ? data.venues.map(v => ({ n: v.name, d: v.distance || '0.3 km', r: v.rating || '4.8', p: v.price_level || '$$', e: v.icon || '📍' })) : mockData[currentCat].nearby,
        shop: mockData[currentCat].shop,
        saves: data.savedPosts.length > 0 ? data.savedPosts.map(s => ({ t: s.type || 'post', l: s.title, u: s.username })) : mockData[currentCat].saves
      };

    } catch (err) {
      console.warn('Backend fallback:', err);
    }
  };
  reader.readAsDataURL(file);
}

const screens = {
home:()=>`${sbar()}
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px 8px">
    <span style="font-size:22px;font-weight:700;font-family:Georgia,serif">Instagram</span>
    <div style="display:flex;gap:16px;font-size:18px">
      <span class="btn" onclick="go('saved')" style="cursor:pointer">🔖</span>
      <span>♥</span>
      <span>💬</span>
    </div>
  </div>

  <!-- Stories Bar -->
  <div style="display:flex;gap:12px;padding:6px 16px 12px;overflow-x:auto">
    ${['Your Story','priya.t','foodie_global','style_edit','tech_lead'].map((u,i)=>`
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">
        <div class="ig-avatar"><div class="ig-avatar-inner">${['S','🌍','🍝','👗','💻'][i]}</div></div>
        <span style="font-size:10px;color:#888">${u}</span>
      </div>
    `).join('')}
  </div>

  <!-- Feed Post 1 -->
  <div class="ig-post">
    <div class="ig-post-header">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="ig-avatar"><div class="ig-avatar-inner">🍝</div></div>
        <div>
          <div style="font-size:12px;font-weight:600">rome_eats <span style="color:#60a5fa">✓</span></div>
          <div style="font-size:10px;color:#888">Trastevere, Rome</div>
        </div>
      </div>
      <span style="color:#888">•••</span>
    </div>
    <div class="ig-media">🍝</div>
    <div class="ig-actions">
      <div style="display:flex;gap:14px"><span>♥</span><span>💬</span><span>↗</span></div>
      <span class="btn" onclick="go('saved')">🔖</span>
    </div>
    <div class="ig-caption">
      <b>rome_eats</b> The most incredible authentic pasta in Rome 🤌
    </div>
  </div>`,

'scout-landing':()=>`${sbar()}
  <div style="display:flex;align-items:center;gap:10px;padding:8px 16px">
    <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>
    <div style="flex:1;background:#1c1c1e;border-radius:10px;padding:8px 12px;color:#666;font-size:13px">🔍 Search Scout...</div>
  </div>

  <div style="text-align:center;padding:24px 16px 16px">
    <div style="width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#9333EA,#EC4899,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px">✦</div>
    <div style="font-size:24px;font-weight:800">Instagram ${grad('Scout')}</div>
    <div style="color:#888;font-size:12px;margin-top:4px">Visual AI Search & Exact Location Detection</div>
  </div>

  <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
    <button class="btn" onclick="go('upload')" style="display:flex;align-items:center;gap:12px;background:#141414;border-radius:14px;padding:14px;border:1px solid #282828">
      <div style="font-size:24px">📷</div>
      <div style="text-align:left;flex:1"><div style="font-weight:600;font-size:13px">Scan / Upload Photo</div><div style="color:#666;font-size:11px">Analyze exact location or fashion item</div></div>
      <span>›</span>
    </button>
    <button class="btn" onclick="go('saved')" style="display:flex;align-items:center;gap:12px;background:#141414;border-radius:14px;padding:14px;border:1px solid #282828">
      <div style="font-size:24px">🔖</div>
      <div style="text-align:left;flex:1"><div style="font-weight:600;font-size:13px">Search Your Saved Collection</div><div style="color:#666;font-size:11px">Match images with saved posts & reels</div></div>
      <span>›</span>
    </button>
  </div>`,

upload:()=>`${sbar()}
  <div style="display:flex;align-items:center;gap:10px;padding:8px 16px">
    <button class="btn" onclick="go('scout-landing')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:15px">Upload to Scout</span>
  </div>
  <div style="padding:20px 16px">
    <input type="file" id="imageUploader" accept="image/*" style="display:none" onchange="processUserFile(this.files[0])">
    <div onclick="document.getElementById('imageUploader').click()" style="cursor:pointer;border:2px dashed #9333EA88;border-radius:20px;padding:40px 20px;text-align:center;background:#9333EA0A">
      <div style="font-size:40px;margin-bottom:10px">📤</div>
      <div style="font-weight:600;font-size:14px">Choose Image from Device</div>
      <div style="color:#666;font-size:11px;margin-top:4px">Locate places, food, or shop fashion</div>
    </div>
  </div>`,

analyzing:()=>`${sbar()}
  <div style="height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center">
    <div style="width:160px;height:160px;border-radius:20px;overflow:hidden;border:2px solid #9333EA;position:relative;margin-bottom:20px">
      ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : `<div style="font-size:70px;line-height:160px">${mockData[currentCat].emoji}</div>`}
      <div style="position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#9333EA,#EC4899,transparent);animation:scanline 1.5s linear infinite;top:0"></div>
    </div>
    <div style="font-weight:700;font-size:16px">Gemini AI Pinpointing Location...</div>
    <div style="color:#666;font-size:12px;margin-top:6px">Analyzing exact street, venue, and style details</div>
  </div>`,

results:()=>{
  const d = mockData[currentCat];
  return `${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">
    <button class="btn" onclick="go('upload')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:14px">Scout Results</span>
    <span style="background:#9333EA22;color:#9333EA;font-size:9px;padding:3px 8px;border-radius:10px;font-weight:700">98% LOCATED</span>
  </div>
  <div style="padding:14px">
    <div style="border-radius:16px;overflow:hidden;height:180px;background:#181818;margin-bottom:12px">
      ${userUploadedImage ? `<img src="${userUploadedImage}" style="width:100%;height:100%;object-fit:cover"/>` : `<div style="font-size:80px;text-align:center;line-height:180px">${d.emoji}</div>`}
    </div>

    <!-- Location Result Box -->
    <div style="background:#141414;border:1px solid #9333EA44;padding:12px;border-radius:12px;margin-bottom:12px">
      <div style="color:#9333EA;font-size:10px;font-weight:700">📍 EXACT LOCATION IDENTIFIED</div>
      <div style="font-weight:600;font-size:13px;margin-top:4px">${d.label}</div>
    </div>

    <!-- Recommendations -->
    <div style="font-size:11px;color:#666;text-transform:uppercase;margin-bottom:8px">Nearby Places & Stores</div>
    ${d.nearby.map(p=>`
      <div style="background:#141414;padding:10px;border-radius:10px;border:1px solid #222;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;font-weight:600">${p.e} ${p.n}</div><div style="font-size:10px;color:#666">📍 ${p.d} · ${p.p}</div></div>
        <div style="color:#f59e0b;font-size:11px;font-weight:700">⭐ ${p.r}</div>
      </div>
    `).join('')}
  </div>`;
},

saved:()=>`${sbar()}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px">
    <button class="btn" onclick="go('home')" style="font-size:20px">‹</button>
    <span style="font-weight:600;font-size:15px">Saved Collection</span>
    <span style="font-size:18px">➕</span>
  </div>
  <div style="padding:12px 16px">
    <div style="color:#888;font-size:12px;margin-bottom:12px">All saved posts, reels & locations indexed by Scout</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:#141414;border:1px solid #222;border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:30px">🍝</div>
        <div style="font-size:12px;font-weight:600;margin-top:6px">Rome Eats</div>
        <div style="font-size:10px;color:#666">12 Saved Items</div>
      </div>
      <div style="background:#141414;border:1px solid #222;border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:30px">👗</div>
        <div style="font-size:12px;font-weight:600;margin-top:6px">Summer Outfits</div>
        <div style="font-size:10px;color:#666">8 Saved Items</div>
      </div>
    </div>
  </div>`
};

function attachEvents(s){
  if(s==='analyzing'){
    setTimeout(()=>go('results'),2000);
  }
}

go('home');
</script>
</body>
</html>
